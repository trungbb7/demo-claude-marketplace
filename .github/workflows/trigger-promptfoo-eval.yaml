name: Trigger Promptfoo Benchmark Eval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - ".github/**"

jobs:
  trigger-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed AI Attributes
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Prepare Payload JSON
        id: prepare-payload
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event": "pull_request",
            "action": "${{ github.event.action }}",
            "pr_number": ${{ github.event.pull_request.number }},
            "commit_sha": "${{ github.event.pull_request.head.sha }}",
            "repository": "${{ github.repository }}",
            "ref": "${{ github.event.pull_request.head.ref }}",
            "changed_files": "${{ steps.changed-files.outputs.changed_files }}",
           
          }
          EOF
          )
          # Compact JSON to avoid newline errors when passing via Curl
          CLEAN_PAYLOAD=$(echo "$PAYLOAD" | jq -c .)
          echo "payload=$CLEAN_PAYLOAD" >> $GITHUB_OUTPUT

      - name: Send Webhook to Promptfoo VM
        env:
          WEBHOOK_URL: ${{ secrets.PROMPTFOO_VM_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.prepare-payload.outputs.payload }}
        run: |
          # Send HTTP POST Webhook
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F':' '{print $2}')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "Failed to trigger Webhook on Promptfoo VM!"
            exit 1
          fi

      - name: Comment PR Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Promptfoo Benchmark Triggered!**\n\n- **Commit SHA:** \`${context.payload.pull_request.head.sha}\`\n- **Status:** Job sent to Promptfoo Runner VM. The results will be automatically updated after completion.`
            })
