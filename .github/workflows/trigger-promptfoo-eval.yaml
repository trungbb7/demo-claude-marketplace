name: Trigger Promptfoo Benchmark Eval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - ".github/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

# Cancel previous evaluation if any
concurrency:
  group: eval-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed AI Attributes
        id: changed-files
        run: |
          # Get list of changed files in PR as JSON array
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Prepare Payload JSON
        id: prepare-payload
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event": "pull_request",
            "action": "${{ github.event.action }}",
            "pr_number": ${{ github.event.pull_request.number }},
            "commit_sha": "${{ github.event.pull_request.head.sha }}",
            "repository": "${{ github.repository }}",
            "ref": "${{ github.event.pull_request.head.ref }}",
            "changed_files": ${{ steps.changed-files.outputs.changed_files }}
           
          }
          EOF
          )
          # Compact JSON to avoid newline errors when passing via Curl
          CLEAN_PAYLOAD=$(echo "$PAYLOAD" | jq -c .)
          echo "payload=$CLEAN_PAYLOAD" >> $GITHUB_OUTPUT

      - name: Send Webhook to Promptfoo VM
        id: send-webhook
        env:
          WEBHOOK_URL: ${{ secrets.PROMPTFOO_VM_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.prepare-payload.outputs.payload }}
        run: |
          # Send HTTP POST Webhook
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F':' '{print $2}')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          # 202 Accepted to acknowledge the request
          if [ "$HTTP_STATUS" -ne 202 ]; then
            echo "::error::Server did not acknowledge the request (expected 202, got $HTTP_STATUS)"
            exit 1
          fi

          echo "Server acknowledged the evaluation request. Running in background..."

      - name: Comment Evaluation Pending Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "## Promptfoo Evaluation In Progress",
                "",
                "| Field | Value |",
                "|-------|-------|",
                `| **Commit SHA** | \`${context.payload.pull_request.head.sha}\` |`,
                `| **Branch** | \`${context.payload.pull_request.head.ref}\` |`,
                "| **Status** | Running evaluation in background... |",
                "",
                "> The Promptfoo Runner VM has acknowledged this request and is now evaluating the AI attributes.",
                "> Results will be automatically posted as a new comment on this PR once the evaluation completes."
              ].join("\n")
            })
